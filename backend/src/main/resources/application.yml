spring:
  application:
    name: jia-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jia}
    username: ${DB_USERNAME:jia}
    password: ${DB_PASSWORD:jia_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true

jia:
  auth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    apple:
      client-id: ${APPLE_SERVICE_ID:}
