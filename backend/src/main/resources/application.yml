spring:
  application:
    name: jia-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jia}
    username: ${DB_USERNAME:jia}
    password: ${DB_PASSWORD:jia_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true

jia:
  auth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    apple:
      client-id: ${APPLE_SERVICE_ID:}
    password-reset-url: ${JIA_PASSWORD_RESET_URL:}
    reset-encryption-key: ${JIA_RESET_ENCRYPTION_KEY:}
    email-outbox-poll-ms: ${JIA_EMAIL_OUTBOX_POLL_MS:15000}
  sms:
    endpoint: ${JIA_SMS_ENDPOINT:}
    token: ${JIA_SMS_TOKEN:}
  otp:
    hmac-secret: ${JIA_OTP_HMAC_SECRET:}
  media:
    s3:
      enabled: ${JIA_MEDIA_S3_ENABLED:false}
      endpoint: ${JIA_MEDIA_S3_ENDPOINT:}
      region: ${JIA_MEDIA_S3_REGION:ap-south-1}
      bucket: ${JIA_MEDIA_S3_BUCKET:}
      upload-url-minutes: ${JIA_MEDIA_UPLOAD_URL_MINUTES:10}
