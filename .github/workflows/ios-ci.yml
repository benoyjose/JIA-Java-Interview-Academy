name: iOS Client CI

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

jobs:
  swift-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build iOS client package
        working-directory: ios
        run: swift build
      - name: Run iOS client tests
        working-directory: ios
        run: swift test
