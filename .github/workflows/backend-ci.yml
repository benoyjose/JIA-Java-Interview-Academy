name: JIA Backend CI
on:
  push:
    paths:
      - 'backend/**'
      - 'docs/api/openapi.yaml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/api/openapi.yaml'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'
      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli lint docs/api/openapi.yaml
      - name: Test backend
        run: gradle -p backend clean test
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.run_id }}
          path: |
            backend/build/test-results/test/**
            backend/build/reports/tests/test/**
          if-no-files-found: ignore
          retention-days: 14
