name: OpenAPI contract lint

on:
  pull_request:
    paths:
      - 'docs/api/openapi.yaml'
      - '.github/workflows/openapi-contract.yml'
      - 'scripts/verify-spring-openapi-routes.mjs'
      - 'scripts/verify-laravel-openapi-routes.mjs'
      - 'docs/api/BACKEND_PARITY_MATRIX.md'
      - 'scripts/validate-backend-parity-matrix.mjs'
      - 'backend-laravel/routes/api.php'
  push:
    branches: [main]
    paths:
      - 'docs/api/openapi.yaml'
      - '.github/workflows/openapi-contract.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Spring Boot routes are documented
        run: node scripts/verify-spring-openapi-routes.mjs
      - name: Verify Laravel routes are documented
        run: node scripts/verify-laravel-openapi-routes.mjs
      - name: Validate backend parity inventory
        run: node scripts/validate-backend-parity-matrix.mjs
      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli lint docs/api/openapi.yaml --extends=minimal
