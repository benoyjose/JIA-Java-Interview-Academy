name: JIA Admin Web CI
on:
  push:
    paths: ["admin-web/**", ".github/workflows/admin-web-ci.yml"]
  pull_request:
    paths: ["admin-web/**", ".github/workflows/admin-web-ci.yml"]
permissions:
  contents: read
jobs:
  admin-web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: admin-web/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify runner Chrome
        run: google-chrome --version
      - name: Type-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - name: Production build
        run: npm run build
      - name: Enforce initial bundle budget
        run: |
          node --input-type=module -e "import { readdirSync, statSync } from 'node:fs'; const files = readdirSync('dist/assets').filter(name => name.endsWith('.js')); const total = files.reduce((sum, name) => sum + statSync('dist/assets/' + name).size, 0); console.log('Total JS bytes:', total); if (total > 350 * 1024) process.exit(1);"
