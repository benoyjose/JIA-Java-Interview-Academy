name: Container build and staging deploy

on:
  pull_request:
    paths:
      - "backend/**"
      - "admin-web/**"
      - "infra/staging.compose.yml"
      - ".github/workflows/container-staging.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "admin-web/**"
      - "infra/staging.compose.yml"
      - ".github/workflows/container-staging.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag to build and deploy (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.sha }}
      - name: Validate release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          [[ "${{ inputs.release_tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --tags --force
          git rev-parse "refs/tags/${{ inputs.release_tag }}^{commit}"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR for release build
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ghcr.io/${{ github.repository_owner }}/jia-api:${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'ci' }}
      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: ./admin-web
          file: ./admin-web/Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ghcr.io/${{ github.repository_owner }}/jia-admin-web:${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'ci' }}

  deploy-staging:
    if: github.event_name == 'workflow_dispatch'
    needs: build-images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/staging_key ~/.ssh/known_hosts
      - name: Prepare staging deployment directory
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/staging_key "$USER@$HOST" "mkdir -p '$DEPLOY_PATH/infra'"
          scp -i ~/.ssh/staging_key infra/staging.compose.yml "$USER@$HOST:$DEPLOY_PATH/infra/staging.compose.yml"
          scp -i ~/.ssh/staging_key infra/staging.env.example "$USER@$HOST:$DEPLOY_PATH/.env.example"
      - name: Authenticate staging host to GHCR
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          GHCR_USER: ${{ secrets.STAGING_GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/staging_key "$USER@$HOST" "docker login ghcr.io --username '$GHCR_USER' --password-stdin"
      - name: Deploy immutable images and wait for health
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          ssh -i ~/.ssh/staging_key "$USER@$HOST" \
            "cd '$DEPLOY_PATH' && RELEASE_TAG='$RELEASE_TAG' GHCR_OWNER='$GHCR_OWNER' docker compose --env-file .env -f infra/staging.compose.yml pull && RELEASE_TAG='$RELEASE_TAG' GHCR_OWNER='$GHCR_OWNER' docker compose --env-file .env -f infra/staging.compose.yml up -d --wait --wait-timeout 240"
      - name: Staging smoke tests
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          ssh -i ~/.ssh/staging_key "$USER@$HOST" \
            "cd '$DEPLOY_PATH' && RELEASE_TAG='$RELEASE_TAG' GHCR_OWNER='$GHCR_OWNER' docker compose --env-file .env -f infra/staging.compose.yml exec -T backend curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness && RELEASE_TAG='$RELEASE_TAG' GHCR_OWNER='$GHCR_OWNER' docker compose --env-file .env -f infra/staging.compose.yml exec -T admin-web wget --quiet --tries=1 --spider http://127.0.0.1:8080/health && RELEASE_TAG='$RELEASE_TAG' GHCR_OWNER='$GHCR_OWNER' docker compose --env-file .env -f infra/staging.compose.yml exec -T admin-web wget --quiet --tries=1 --spider http://backend:8080/api/v1/technologies"
