name: Android App CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "docs/api/openapi.yaml"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "docs/api/openapi.yaml"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # GitHub-hosted Linux runners do not expose KVM; Android emulator requires TCG fallback.
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install compile SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Run Android unit tests
        run: gradle -p android :app:testDebugUnitTest --no-daemon

      - name: Run Android lint
        run: gradle -p android :app:lintDebug --no-daemon

      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Assemble unsigned release APK
        run: gradle -p android :app:assembleRelease --no-daemon


  android-instrumentation:
    # Isolate the emulator from lint/release packaging. TCG emulation is CPU-heavy
    # on GitHub-hosted Linux and must not compete with a Gradle release build.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install compile SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Run Compose UI tests on isolated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          emulator-options: "-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096"
          emulator-boot-timeout: 900
          disable-animations: false
          script: |
            set +e
            mkdir -p android/app/build/ci-diagnostics
            adb logcat -c
            gradle -p android :app:connectedDebugAndroidTest --no-daemon --info > android/app/build/ci-diagnostics/gradle-instrumentation.log 2>&1
            test_status=$?
            cat android/app/build/ci-diagnostics/gradle-instrumentation.log
            if [ "$test_status" -ne 0 ]; then
              adb logcat -d -t 12000 > android/app/build/ci-diagnostics/emulator-logcat.txt 2>&1 || true
              echo "=== Test XML failures ==="
              find android/app/build/outputs/androidTest-results -name '*.xml' -type f -print -exec grep -E -n -C 4 '<failure|<error|testsuite|testcase' {} \; 2>/dev/null || true
              echo "=== Crash / assertion summary ==="
              grep -E -i -n -C 5 "AndroidRuntime|FATAL EXCEPTION|Instrumentation|TestRunner|Assertion|Compose|junit|crash|ANR" android/app/build/ci-diagnostics/emulator-logcat.txt | tail -n 500 || true
            fi
            exit "$test_status"

      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-diagnostics-${{ github.run_id }}
          path: |
            android/app/build/ci-diagnostics/
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 7
