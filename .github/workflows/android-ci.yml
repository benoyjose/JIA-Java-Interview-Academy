name: Android App CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "docs/api/openapi.yaml"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "docs/api/openapi.yaml"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install compile SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Run Android unit tests
        run: gradle -p android :app:testDebugUnitTest --no-daemon

      - name: Run Android lint
        run: gradle -p android :app:lintDebug --no-daemon

      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Assemble unsigned release APK
        run: gradle -p android :app:assembleRelease --no-daemon

      - name: Upload Android unit test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-lint-reports-${{ github.run_id }}
          path: |
            android/app/build/reports/tests/**
            android/app/build/reports/lint-results*
            android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Android APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-${{ github.run_id }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  android-instrumentation:
    # Keep emulator execution isolated from packaging. Hosted runners use TCG when KVM is unavailable.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install compile SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Run Compose UI tests on isolated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          emulator-options: "-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096"
          emulator-boot-timeout: 900
          disable-animations: false
          script: gradle -p android :app:connectedDebugAndroidTest --no-daemon --info

      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-diagnostics-${{ github.run_id }}
          path: |
            android/app/build/ci-diagnostics/
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 7
