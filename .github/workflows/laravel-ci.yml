name: Laravel API CI

on:
  push:
    paths:
      - "backend-laravel/**"
      - ".github/workflows/laravel-ci.yml"
      - "docs/api/openapi.yaml"
      - "docs/api/error-response-parity.json"
  pull_request:
    paths:
      - "backend-laravel/**"
      - ".github/workflows/laravel-ci.yml"
      - "docs/api/openapi.yaml"
      - "docs/api/error-response-parity.json"

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_DB: jia_test
          POSTGRES_USER: jia
          POSTGRES_PASSWORD: jia_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jia -d jia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: jia_test
      DB_USERNAME: jia
      DB_PASSWORD: jia_test_only
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --no-check-publish backend-laravel/composer.json
      - name: Resolve PHP dependencies
        run: composer install --working-dir backend-laravel --no-interaction --prefer-dist --no-progress
      - name: Prepare Laravel writable runtime directories
        run: mkdir -p backend-laravel/bootstrap/cache backend-laravel/storage/framework/cache backend-laravel/storage/framework/sessions backend-laravel/storage/framework/views backend-laravel/storage/logs
      - name: Verify Laravel application boots and routes register
        working-directory: backend-laravel
        run: php artisan route:list --except-vendor

      - name: Apply all Laravel PostgreSQL migrations
        working-directory: backend-laravel
        run: php artisan migrate --force

      - name: Audit Composer dependencies
        run: composer audit --working-dir backend-laravel

      - name: PHP syntax check
        run: find backend-laravel -type f -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Laravel unit and HTTP parity tests
        working-directory: backend-laravel
        run: vendor/bin/phpunit --bootstrap vendor/autoload.php tests
