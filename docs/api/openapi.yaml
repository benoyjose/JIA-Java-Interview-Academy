openapi: 3.1.0
info:
  title: JIA API
  version: 1.3.0
  description: >-
    Normative contract for currently implemented Spring Boot and Laravel API routes.
    Planned CMS, progress, synchronization and release endpoints are added only when
    implemented and tested in both backends.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Catalogue
paths:
  /auth/register:
    post:
      summary: Register a learner account
      security: []
      tags: [Authentication]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 160 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '201':
          description: Learner account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    post:
      summary: Sign in with email and password
      security: []
      tags: [Authentication]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, maxLength: 128 }
                deviceName: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/federated/google:
    post:
      summary: Sign in with Google
      security: []
      tags: [Authentication]
      operationId: authenticateWithGoogle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken, nonce]
              properties:
                idToken: { type: string, maxLength: 12000 }
                nonce: { type: string, maxLength: 256 }
                deviceName: { type: string, maxLength: 100 }
      responses:
        '200':
          description: JIA session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: Provider sign-in is not configured }
  /auth/federated/apple:
    post:
      summary: Sign in with Apple
      security: []
      tags: [Authentication]
      operationId: authenticateWithApple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityToken, nonce]
              properties:
                identityToken: { type: string, maxLength: 12000 }
                nonce: { type: string, maxLength: 256 }
                deviceName: { type: string, maxLength: 100 }
      responses:
        '200':
          description: JIA session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: Provider sign-in is not configured }
  /auth/phone/otp:
    post:
      summary: Request a phone verification code
      security: []
      tags: [Authentication]
      operationId: requestPhoneOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber]
              properties:
                phoneNumber:
                  type: string
                  pattern: '^\+[1-9][0-9]{7,14}$'
                  example: '+919876543210'
      responses:
        '202': { description: SMS challenge created and delivery accepted }
        '503': { description: SMS gateway is not configured or is unavailable }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/phone/verify:
    post:
      summary: Verify a phone verification code
      security: []
      tags: [Authentication]
      operationId: verifyPhoneOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber, code]
              properties:
                phoneNumber:
                  type: string
                  pattern: '^\+[1-9][0-9]{7,14}$'
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
                deviceName:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Phone verified and session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/me:
    get:
      summary: Get the current authenticated account
      operationId: getCurrentAccount
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      summary: Revoke the current session token
      operationId: logout
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Token revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /technologies:
    get:
      summary: List published technology tracks
      security: []
      tags: [Catalogue]
      operationId: listTechnologies
      responses:
        '200':
          description: Published technologies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Technology' }
  /technologies/{slug}:
    get:
      summary: Get a published technology track
      security: []
      tags: [Catalogue]
      operationId: getTechnology
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: Published technology
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Technology' }
        '404': { $ref: '#/components/responses/NotFound' }
  /technologies/{technologySlug}/categories:
    get:
      summary: List published categories for a technology
      security: []
      tags: [Catalogue]
      operationId: listCategories
      parameters:
        - name: technologySlug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Published categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
  /categories/{categorySlug}/lessons:
    get:
      summary: List published lessons in a category
      security: []
      tags: [Catalogue]
      operationId: listLessons
      parameters:
        - name: categorySlug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Published lessons
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LessonSummary' }
  /lessons/{slug}:
    get:
      summary: Get a published lesson
      security: []
      tags: [Catalogue]
      operationId: getLesson
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: Published lesson
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
        '404': { $ref: '#/components/responses/NotFound' }

  /quizzes/availability:
    get:
      security: []
      summary: Preview published question availability by difficulty and topic
      tags: [Assessments]
      operationId: getQuizAvailability
      parameters:
        - name: technologySlug
          in: query
          schema: { type: string }
        - name: categorySlug
          in: query
          schema: { type: string }
        - name: difficulty
          in: query
          required: true
          schema: { $ref: '#/components/schemas/QuizDifficulty' }
      responses:
        '200':
          description: Available published question count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizAvailability' }
  /quiz-attempts:
    post:
      summary: Start a difficulty-selected quiz attempt
      tags: [Assessments]
      operationId: startQuizAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [difficulty]
              properties:
                technologySlug: { type: string }
                categorySlug: { type: string }
                difficulty: { $ref: '#/components/schemas/QuizDifficulty' }
                questionCount: { type: integer, minimum: 1, maximum: 100, default: 10 }
                mode:
                  type: string
                  enum: [PRACTICE, TIMED_MOCK, DAILY_CHALLENGE, WEAK_AREA]
                  default: PRACTICE
      responses:
        '201':
          description: Quiz attempt created; answer keys are withheld
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizAttemptStart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /quiz-attempts/{attemptId}/submit:
    post:
      summary: Submit and grade a quiz attempt
      tags: [Assessments]
      operationId: submitQuizAttempt
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    required: [position, response]
                    properties:
                      position: { type: integer, minimum: 1 }
                      response: { type: object, additionalProperties: true }
                      timeSpentMs: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Attempt graded and saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizAttemptResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/quiz-performance:
    get:
      summary: Get learner quiz performance by difficulty and topic
      tags: [Assessments]
      operationId: getMyQuizPerformance
      responses:
        '200':
          description: Difficulty and topic performance summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizPerformance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/quiz-attempts:
    get:
      summary: List the authenticated learner's quiz history
      tags: [Assessments]
      operationId: listMyQuizAttempts
      parameters:
        - name: difficulty
          in: query
          schema: { $ref: '#/components/schemas/QuizDifficulty' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Recent quiz attempts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QuizAttemptSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque token
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Not found or not published
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimited:
      description: Request rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [BAD_REQUEST, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, VALIDATION_ERROR, RATE_LIMITED, INTERNAL_ERROR, HTTP_ERROR]
        message: { type: string }
        traceId: { type: string, description: Optional request correlation identifier }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    User:
      type: object
      required: [id, name, roles]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: [string, 'null'], format: email }
        roles:
          type: array
          items: { type: string }
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
    Technology:
      type: object
      required: [id, slug, name, sortOrder]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        sortOrder: { type: integer }
    Category:
      type: object
      required: [id, slug, name, sortOrder, technologySlug]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        sortOrder: { type: integer }
        technologySlug: { type: string }
    LessonSummary:
      type: object
      required: [id, slug, title, difficulty, contentRevision]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: [string, 'null'] }
        difficulty: { type: string }
        contentRevision: { type: integer }

    QuizDifficulty:
      type: string
      enum: [BEGINNER, NOVICE, PROFESSIONAL, EXPERT]
    QuizAvailability:
      type: object
      required: [difficulty, availableQuestionCount]
      properties:
        difficulty: { $ref: '#/components/schemas/QuizDifficulty' }
        availableQuestionCount: { type: integer, minimum: 0 }
    QuizQuestion:
      type: object
      required: [position, questionId, revisionId, questionType, prompt, difficulty]
      properties:
        position: { type: integer }
        questionId: { type: string, format: uuid }
        revisionId: { type: string, format: uuid }
        questionType: { type: string }
        prompt: { type: object, additionalProperties: true }
        options: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        hint: { type: [string, 'null'] }
        difficulty: { $ref: '#/components/schemas/QuizDifficulty' }
    QuizAttemptStart:
      type: object
      required: [attemptId, difficulty, mode, questionCount, questions]
      properties:
        attemptId: { type: string, format: uuid }
        difficulty: { $ref: '#/components/schemas/QuizDifficulty' }
        mode: { type: string }
        questionCount: { type: integer }
        questions:
          type: array
          items: { $ref: '#/components/schemas/QuizQuestion' }
    QuizAttemptResult:
      type: object
      required: [attemptId, difficulty, questionCount, correctCount, scorePercent, submittedAt]
      properties:
        attemptId: { type: string, format: uuid }
        difficulty: { $ref: '#/components/schemas/QuizDifficulty' }
        questionCount: { type: integer }
        correctCount: { type: integer }
        scorePercent: { type: number, minimum: 0, maximum: 100 }
        submittedAt: { type: string, format: date-time }
        answers:
          type: array
          items:
            type: object
            required: [position, isCorrect, explanation]
            properties:
              position: { type: integer }
              isCorrect: { type: boolean }
              explanation: { type: string }
    QuizAttemptSummary:
      type: object
      required: [attemptId, difficulty, questionCount, correctCount, scorePercent, startedAt, status]
      properties:
        attemptId: { type: string, format: uuid }
        difficulty: { $ref: '#/components/schemas/QuizDifficulty' }
        technologySlug: { type: [string, 'null'] }
        categorySlug: { type: [string, 'null'] }
        questionCount: { type: integer }
        correctCount: { type: [integer, 'null'] }
        scorePercent: { type: [number, 'null'] }
        startedAt: { type: string, format: date-time }
        status: { type: string }
    QuizPerformance:
      type: object
      required: [byDifficulty, byTopic]
      properties:
        byDifficulty:
          type: array
          items:
            type: object
            required: [difficulty, attempts, questionsAttempted, correctAnswers, accuracyPercent]
            properties:
              difficulty: { $ref: '#/components/schemas/QuizDifficulty' }
              attempts: { type: integer }
              questionsAttempted: { type: integer }
              correctAnswers: { type: integer }
              accuracyPercent: { type: [number, 'null'] }
              bestScorePercent: { type: [number, 'null'] }
              latestAttemptAt: { type: [string, 'null'], format: date-time }
        byTopic:
          type: array
          items:
            type: object
            required: [technologySlug, difficulty, attempts, accuracyPercent]
            properties:
              technologySlug: { type: [string, 'null'] }
              categorySlug: { type: [string, 'null'] }
              difficulty: { $ref: '#/components/schemas/QuizDifficulty' }
              attempts: { type: integer }
              accuracyPercent: { type: [number, 'null'] }
    Lesson:
      allOf:
        - $ref: '#/components/schemas/LessonSummary'
        - type: object
          required: [sourceType]
          properties:
            sourceType: { type: string }
            contentJson: { type: [string, 'null'] }
