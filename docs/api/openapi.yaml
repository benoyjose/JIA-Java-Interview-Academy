openapi: 3.1.0
info:
  title: JIA API
  version: 1.5.0
  description: >-
    Normative contract for the production Spring Boot API. Laravel compatibility
    is limited to the explicitly documented shared routes; Spring-first capabilities
    are not a Laravel release blocker.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: App Registry
    description: Registered branded application identities and per-app release compatibility.
  - name: Authentication
    description: Account registration, sign-in and session management.
  - name: Catalogue
    description: Public technology, category and lesson catalogue.
  - name: Content Admin
    description: Controlled content authoring, review and publication.
  - name: Learning
    description: Authenticated learner progress and saved lessons.
  - name: Subscriptions
    description: Academy-scoped subscription and entitlement lifecycle.
  - name: Learner Discovery
    description: Academy-scoped search and explainable learning recommendations.
  - name: Learner Notifications
    description: Learner revision schedules, preferences and in-app reminders.
paths:
  /public/academies/{academyCode}/search:
    get:
      summary: Search published public academy content without registration
      security: []
      tags: [Catalogue]
      operationId: searchPublicAcademyCatalogue
      parameters:
        - { name: academyCode, in: path, required: true, schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,39}$' } }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 80 } }
        - { name: type, in: query, schema: { type: string, enum: [ALL, TECHNOLOGY, CATEGORY, LESSON, QUESTION], default: ALL } }
        - { name: difficulty, in: query, schema: { type: string, enum: [ALL, BEGINNER, NOVICE, PROFESSIONAL, EXPERT], default: ALL } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Academy-scoped published public search results; question prompts only, never answer keys
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, totalItems, totalPages]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [type, slug, title, summary]
                      properties:
                        type: { type: string, enum: [TECHNOLOGY, CATEGORY, LESSON, QUESTION] }
                        slug: { type: string }
                        title: { type: string }
                        summary: { type: string }
                        categorySlug: { type: [string, 'null'] }
                  page: { type: integer }
                  size: { type: integer }
                  totalItems: { type: integer, format: int64 }
                  totalPages: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/mastery:
    get:
      summary: Read authenticated learner topic mastery evidence
      tags: [Learning]
      operationId: getLearnerMastery
      responses:
        '200':
          description: Server-derived, versioned topic mastery estimate using objective answers, published lesson completion and review recency; indicative, not certification
          content:
            application/json:
              schema:
                type: object
                required: [modelVersion, topics]
                properties:
                  modelVersion: { type: integer, const: 1 }
                  topics:
                    type: array
                    items:
                      type: object
                      required: [topicSlug, topicName, answers, correct, completedLessons, availableLessons, masteryScore, masteryBand, reviewDue, masteryModelVersion]
                      properties:
                        topicSlug: { type: string }
                        topicName: { type: string }
                        answers: { type: integer, minimum: 0 }
                        correct: { type: integer, minimum: 0 }
                        completedLessons: { type: integer, minimum: 0 }
                        availableLessons: { type: integer, minimum: 0 }
                        masteryScore: { type: integer, minimum: 0, maximum: 100 }
                        masteryBand: { type: string, enum: [NOT_ASSESSED, DEVELOPING, PRACTICING, MASTERED, REVIEW_DUE] }
                        reviewDue: { type: boolean }
                        lastDemonstratedAt: { type: [string, 'null'], format: date-time }
                        masteryModelVersion: { type: integer, const: 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/reminder-preferences:
    get:
      summary: Read authenticated learner reminder, quiet-hours and study-goal preferences
      tags: [Learning]
      operationId: getLearnerReminderPreferences
      responses:
        '200':
          description: Persisted preferences or server defaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerReminderPreferences'
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Replace authenticated learner reminder and study-goal preferences
      tags: [Learning]
      operationId: updateLearnerReminderPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerReminderPreferences'
      responses:
        '200':
          description: Saved preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerReminderPreferences'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/commitment:
    get:
      summary: Read the authenticated learner's daily goal and streak
      tags: [Learning]
      operationId: getLearnerCommitment
      parameters:
        - { name: timezone, in: query, required: true, schema: { type: string, format: timezone } }
      responses:
        '200':
          description: Current local-day commitment and consecutive completed-goal streak
          content:
            application/json:
              schema:
                type: object
                required: [date, timezone, goalMinutes, completedMinutes, goalMet, streakDays]
                properties:
                  date: { type: string, format: date }
                  timezone: { type: string }
                  goalMinutes: { type: integer, minimum: 5, maximum: 240 }
                  completedMinutes: { type: integer, minimum: 0 }
                  goalMet: { type: boolean }
                  streakDays: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/commitment/sessions:
    post:
      summary: Record a completed learning session toward the daily commitment
      tags: [Learning]
      operationId: recordLearnerCommitmentSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timezone, minutes, sessionId]
              properties:
                timezone: { type: string }
                minutes: { type: integer, minimum: 1, maximum: 240 }
                sessionId: { type: string, format: uuid }
                goalMinutes: { type: integer, minimum: 5, maximum: 240 }
      responses:
        '200': { description: Updated daily commitment }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/study-plan:
    get:
      summary: Generate an authenticated learner's personalized daily study plan
      tags: [Learning]
      operationId: getLearnerStudyPlan
      parameters:
        - name: dailyMinutes
          in: query
          required: false
          schema: { type: integer, minimum: 10, maximum: 180, default: 30 }
      responses:
        '200':
          description: Ordered lesson and weak-topic tasks within the requested daily time budget
          content:
            application/json:
              schema:
                type: object
                required: [dailyMinutes, planVersion, curriculumPrerequisitesEnabled, tasks]
                properties:
                  dailyMinutes: { type: integer, minimum: 10, maximum: 180 }
                  generatedAt: { type: [string, 'null'], format: date-time }
                  tasks:
                    type: array
                    items:
                      type: object
                      required: [kind, title, minutes, reason]
                      properties:
                        kind: { type: string, enum: [CONTINUE_LESSON, PRACTICE_TOPIC] }
                        title: { type: string }
                        lessonSlug: { type: [string, 'null'] }
                        topicSlug: { type: [string, 'null'] }
                        minutes: { type: integer, minimum: 1 }
                        reason: { type: string }
                        priority: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/privacy/export:
    get:
      summary: Export learner-owned personal data for portability
      tags: [Learning]
      operationId: exportLearnerPersonalData
      description: >-
        Returns the authenticated learner's profile, learning progress, bookmarks,
        quiz attempts and responses, revision schedule, notification preferences
        and in-app notifications. Excludes credentials, password hashes, provider
        secrets, global question answer keys and other learners' records.
      responses:
        '200':
          description: Versioned JSON data export
          content:
            application/json:
              schema:
                type: object
                required: [formatVersion, generatedAt, profile, lessonProgress, bookmarks, quizAttempts, quizResponses, revisionSchedule, notificationPreferences, notifications]
                properties:
                  formatVersion: { type: integer, const: 1 }
                  generatedAt: { type: string, format: date-time }
                  profile: { type: array, items: { type: object } }
                  lessonProgress: { type: array, items: { type: object } }
                  bookmarks: { type: array, items: { type: object } }
                  quizAttempts: { type: array, items: { type: object } }
                  quizResponses: { type: array, items: { type: object } }
                  revisionSchedule: { type: array, items: { type: object } }
                  notificationPreferences: { type: array, items: { type: object } }
                  notifications: { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/progress-snapshot:
    get:
      summary: Read paginated server-derived learner progress
      tags: [Learning]
      operationId: getLearnerProgressSnapshot
      parameters:
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: afterSlug, in: query, schema: { type: string, maxLength: 160 } }
      responses:
        '200':
          description: Academy-scoped progress and server-computed aggregate
          content:
            application/json:
              schema:
                type: object
                required: [items, aggregate]
                properties:
                  items: { type: array, items: { type: object } }
                  nextAfterSlug: { type: [string, 'null'] }
                  aggregate:
                    type: object
                    required: [lessonsStarted, lessonsCompleted, averageProgressPercent]
                    properties:
                      lessonsStarted: { type: integer, format: int64 }
                      lessonsCompleted: { type: integer, format: int64 }
                      averageProgressPercent: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /coding-submissions:
    post:
      summary: Queue a Java coding practice submission; execution remains disabled
      tags: [Learning]
      operationId: createCodingSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exerciseId, idempotencyKey, language, sourceCode]
              properties:
                exerciseId: { type: string, format: uuid }
                idempotencyKey: { type: string, format: uuid }
                language: { type: string, const: JAVA }
                sourceCode: { type: string, minLength: 1, maxLength: 65536 }
      responses:
        '202': { description: Queued; sandbox execution is disabled }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: Source exceeds 64 KiB }
  /coding-submissions/{submissionId}:
    get:
      summary: Read owned coding submission status
      tags: [Learning]
      operationId: getCodingSubmissionStatus
      parameters:
        - { name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Status and execution-disabled notice }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /coding-submissions/{submissionId}/cancel:
    post:
      summary: Cancel a queued submission or request cancellation
      tags: [Learning]
      operationId: cancelCodingSubmission
      parameters:
        - { name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Current status and cancellation state }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /health/live:
    get:
      summary: Report API process liveness
      security: []
      tags: [Operations]
      operationId: getLaravelLiveness
      responses:
        '200':
          description: API process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: UP }
  /health/ready:
    get:
      summary: Report database readiness
      security: []
      tags: [Operations]
      operationId: getLaravelReadiness
      responses:
        '200':
          description: Database query succeeded
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: READY }
        '503':
          description: Database is not ready; no diagnostic secrets are returned
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: NOT_READY }
  /apps/{appCode}/release-policy:
    get:
      summary: Resolve registered application identity and public release compatibility policy
      security: []
      tags: [App Registry]
      operationId: getRegisteredAppReleasePolicy
      parameters:
        - name: appCode
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z][A-Z0-9_]{2,39}$'
        - name: platform
          in: query
          required: true
          schema: { type: string, enum: [ANDROID, IOS] }
        - name: applicationId
          in: query
          required: true
          schema: { type: string, maxLength: 255 }
        - name: installedVersion
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9]{1,5}(\.[0-9]{1,5}){2}$'
      responses:
        '200':
          description: Registered app and release policy
          content:
            application/json:
              schema:
                type: object
                required: [appCode, platform, applicationId, displayName, status, updateStatus]
                properties:
                  appCode: { type: string }
                  platform: { type: string, enum: [ANDROID, IOS] }
                  applicationId: { type: string }
                  displayName: { type: string }
                  status: { type: string, enum: [PLANNED, ACTIVE] }
                  minimumSupportedVersion: { type: [string, 'null'] }
                  currentVersion: { type: [string, 'null'] }
                  storeUrl: { type: [string, 'null'], format: uri }
                  releaseNotes: { type: [string, 'null'] }
                  releasedAt: { type: [string, 'null'], format: date-time }
                  updateStatus: { type: string, enum: [CURRENT, UPDATE_AVAILABLE, UPDATE_REQUIRED] }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: App identity is suspended or retired }
    put:
      summary: Update registered app release policy
      tags: [Content Admin]
      operationId: updateRegisteredAppReleasePolicy
      security: [{ bearerAuth: [] }]
      parameters:
        - name: appCode
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z][A-Z0-9_]{2,39}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [PLANNED, ACTIVE, SUSPENDED, RETIRED] }
                minimumSupportedVersion: { type: [string, 'null'], maxLength: 40 }
                currentVersion: { type: [string, 'null'], maxLength: 40 }
                storeUrl: { type: [string, 'null'], format: uri, maxLength: 1000 }
                releaseNotes: { type: [string, 'null'], maxLength: 5000 }
      responses:
        '200': { description: Release policy updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/academies/{academyCode}/entitlements:
    get:
      summary: List active academy entitlements for the authenticated learner
      tags: [Subscriptions]
      operationId: getAcademyEntitlements
      parameters:
        - name: academyCode
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,39}$' }
      responses:
        '200':
          description: Current, unexpired entitlements
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [code, status]
                  properties:
                    code: { type: string }
                    status: { type: string, enum: [ACTIVE, GRACE] }
                    validUntil: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payments/webhooks/{providerCode}:
    post:
      summary: Receive an HMAC-authenticated normalized payment-provider event
      security: []
      tags: [Subscriptions]
      operationId: receivePaymentProviderWebhook
      parameters:
        - name: providerCode
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,39}$' }
        - name: X-Payment-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=[a-fA-F0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, subscriptionId]
              properties:
                id: { type: string, maxLength: 180 }
                type: { type: string, maxLength: 80, enum: [subscription.activated, subscription.renewed, payment.succeeded, payment.failed, subscription.expired, subscription.cancelled, payment.refunded] }
                subscriptionId: { type: string, maxLength: 180 }
                periodEnd: { type: [string, 'null'], format: date-time }
                entitlementCode: { type: [string, 'null'], maxLength: 80 }
      responses:
        '200': { description: 'Event processed, ignored or deduplicated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Invalid HMAC signature }
        '404': { description: Provider subscription reference is not linked }
        '503': { description: Webhook processing is disabled until configured }
  /me/academies/{academyCode}/subscriptions:
    get:
      summary: List the authenticated learner's subscription status for an academy
      tags: [Subscriptions]
      operationId: getAcademySubscriptions
      parameters:
        - name: academyCode
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,39}$' }
      responses:
        '200':
          description: Subscription state, including cancellation and renewal period
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [providerCode, planCode, status, cancelAtPeriodEnd]
                  properties:
                    providerCode: { type: string }
                    planCode: { type: string }
                    status: { type: string, enum: [ACTIVE, GRACE, EXPIRED, CANCELLED, REFUNDED] }
                    currentPeriodEnd: { type: [string, 'null'], format: date-time }
                    cancelAtPeriodEnd: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /academies/{academyCode}/plans:
    get:
      summary: List active subscription plans for an academy
      security: []
      tags: [Subscriptions]
      operationId: getAcademySubscriptionPlans
      parameters:
        - name: academyCode
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,39}$' }
      responses:
        '200':
          description: Available active plans
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [code, name, priceMinor, currency, billingInterval]
                  properties:
                    code: { type: string }
                    name: { type: string }
                    priceMinor: { type: integer, minimum: 0 }
                    currency: { type: string, minLength: 3, maxLength: 3 }
                    billingInterval: { type: string, enum: [MONTHLY, YEARLY, LIFETIME] }
                    featuresJson: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/academies/{academyCode}/search:
    get:
      summary: Search published academy curriculum and question metadata
      tags: [Learner Discovery]
      operationId: searchAcademyLearningContent
      parameters:
        - { name: academyCode, in: path, required: true, schema: { type: string } }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Ranked academy search results
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [type, slug, title, summary]
                  properties:
                    type: { type: string, enum: [TECHNOLOGY, CATEGORY, LESSON, QUESTION] }
                    slug: { type: string }
                    title: { type: string }
                    summary: { type: string }
                    categorySlug: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/academies/{academyCode}/recommendations:
    get:
      summary: Get deterministic personalized lesson recommendations
      tags: [Learner Discovery]
      operationId: getAcademyLearningRecommendations
      parameters:
        - { name: academyCode, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 30, default: 12 } }
      responses:
        '200':
          description: Explainable results ranked by bookmarks, progress and curriculum
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [lessonSlug, title, summary, reason]
                  properties:
                    lessonSlug: { type: string }
                    title: { type: string }
                    summary: { type: string }
                    categorySlug: { type: string }
                    reason: { type: string, enum: [BOOKMARKED, CONTINUE_LEARNING, NEXT_IN_TRACK, POPULAR_START] }
  /me/academies/{academyCode}/notification-preferences:
    get:
      summary: Read learner reminder and quiet-hour preferences
      tags: [Learner Notifications]
      operationId: getAcademyNotificationPreferences
      parameters: [{ name: academyCode, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearnerNotificationPreferences' }
    put:
      summary: Update learner reminder and quiet-hour preferences
      tags: [Learner Notifications]
      operationId: updateAcademyNotificationPreferences
      parameters: [{ name: academyCode, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LearnerNotificationPreferences' }
      responses:
        '200':
          description: Preferences saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearnerNotificationPreferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /me/academies/{academyCode}/revision-schedule:
    get:
      summary: List spaced-repetition due dates and materialize due reminders
      tags: [Learner Notifications]
      operationId: getAcademyRevisionSchedule
      parameters: [{ name: academyCode, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Learner revision schedule
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RevisionDue' }
  /me/academies/{academyCode}/revision-schedule/{lessonSlug}/reviewed:
    post:
      summary: Record review and advance spaced-repetition interval
      tags: [Learner Notifications]
      operationId: recordAcademyLessonReview
      parameters:
        - { name: academyCode, in: path, required: true, schema: { type: string } }
        - { name: lessonSlug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Review recorded }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/academies/{academyCode}/notifications:
    get:
      summary: List due in-app notifications
      tags: [Learner Notifications]
      operationId: listAcademyLearnerNotifications
      parameters:
        - { name: academyCode, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LearnerNotification' }
  /me/academies/{academyCode}/notifications/{notificationId}/read:
    post:
      summary: Mark an owned academy notification as read
      tags: [Learner Notifications]
      operationId: markAcademyLearnerNotificationRead
      parameters:
        - { name: academyCode, in: path, required: true, schema: { type: string } }
        - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Notification marked read }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/register:
