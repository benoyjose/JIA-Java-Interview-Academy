openapi: 3.1.0
info:
  title: JIA API
  version: 1.2.0
  description: Shared versioned API contract for Spring Boot and Laravel backends.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Catalogue
paths:
  /auth/register:
    post:
      summary: Register a learner account
      security: []
      tags: [Authentication]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 160 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '201':
          description: Learner account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '409': { description: Email already registered }
  /auth/login:
    post:
      summary: Sign in with email and password
      security: []
      tags: [Authentication]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, maxLength: 128 }
                deviceName: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { description: Invalid credentials }
  /auth/federated/google:
    post:
      summary: Sign in with Google
      security: []
      tags: [Authentication]
      operationId: authenticateWithGoogle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken, nonce]
              properties:
                idToken: { type: string, maxLength: 12000 }
                nonce: { type: string, maxLength: 256 }
                deviceName: { type: string, maxLength: 100 }
      responses:
        '200':
          description: JIA session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { description: Invalid, expired or untrusted provider token }
        '409': { description: Identity requires explicit account linking }
        '503': { description: Provider sign-in is not configured }
  /auth/federated/apple:
    post:
      summary: Sign in with Apple
      security: []
      tags: [Authentication]
      operationId: authenticateWithApple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityToken, nonce]
              properties:
                identityToken: { type: string, maxLength: 12000 }
                nonce: { type: string, maxLength: 256 }
                deviceName: { type: string, maxLength: 100 }
      responses:
        '200':
          description: JIA session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { description: Invalid, expired or untrusted provider token }
        '409': { description: Identity requires explicit account linking }
        '503': { description: Provider sign-in is not configured }
  /auth/phone/otp:
    post:
      summary: Request a phone verification code
      security: []
      tags: [Authentication]
      operationId: requestPhoneOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber]
              properties:
                phoneNumber:
                  type: string
                  pattern: '^\+[1-9][0-9]{7,14}$'
                  example: '+919876543210'
      responses:
        '202': { description: SMS challenge created and delivery accepted }
        '503': { description: SMS gateway is not configured or is unavailable }
        '429': { description: Rate limit exceeded }
  /auth/phone/verify:
    post:
      summary: Verify a phone verification code
      security: []
      tags: [Authentication]
      operationId: verifyPhoneOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber, code]
              properties:
                phoneNumber:
                  type: string
                  pattern: '^\+[1-9][0-9]{7,14}$'
                code: { type: string, pattern: '^[0-9]{6}
                deviceName: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Phone verified and session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { description: Invalid or expired code }
        '429': { description: Verification attempt limit exceeded }
  /auth/me:
    get:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { description: Unauthenticated }
  /auth/logout:
    post:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Token revoked }
        '401': { description: Unauthenticated }
  /technologies:
    get:
      summary: List published technology tracks
      security: []
      tags: [Catalogue]
      operationId: listTechnologies
      responses:
        '200':
          description: Published technologies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Technology' }
  /technologies/{slug}:
    get:
      summary: Get a published technology track
      security: []
      tags: [Catalogue]
      operationId: getTechnology
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: Published technology
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Technology' }
        '404': { $ref: '#/components/responses/NotFound' }
  /technologies/{technologySlug}/categories:
    get:
      summary: List published categories for a technology
      security: []
      tags: [Catalogue]
      operationId: listCategories
      parameters:
        - name: technologySlug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Published categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
  /categories/{categorySlug}/lessons:
    get:
      summary: List published lessons in a category
      security: []
      tags: [Catalogue]
      operationId: listLessons
      parameters:
        - name: categorySlug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Published lessons
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LessonSummary' }
  /lessons/{slug}:
    get:
      summary: Get a published lesson
      security: []
      tags: [Catalogue]
      operationId: getLesson
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: Published lesson
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque token
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
  responses:
    NotFound:
      description: Not found or not published
  schemas:
    User:
      type: object
      required: [id, name, roles]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: [string, 'null'], format: email }
        roles:
          type: array
          items: { type: string }
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
    Technology:
      type: object
      required: [id, slug, name, sortOrder]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        sortOrder: { type: integer }
    Category:
      type: object
      required: [id, slug, name, sortOrder, technologySlug]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        sortOrder: { type: integer }
        technologySlug: { type: string }
    LessonSummary:
      type: object
      required: [id, slug, title, difficulty, contentRevision]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: [string, 'null'] }
        difficulty: { type: string }
        contentRevision: { type: integer }
    Lesson:
      allOf:
        - $ref: '#/components/schemas/LessonSummary'
        - type: object
          required: [sourceType]
          properties:
            sourceType: { type: string }
            contentJson: { type: [string, 'null'] }
 }
                deviceName: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Phone verified and session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { description: Invalid or expired code }
        '429': { description: Verification attempt limit exceeded }
  /auth/me:
    get:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { description: Unauthenticated }
  /auth/logout:
    post:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Token revoked }
        '401': { description: Unauthenticated }
  /technologies:
    get:
      summary: List published technology tracks
      security: []
      tags: [Catalogue]
      operationId: listTechnologies
      responses:
        '200':
          description: Published technologies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Technology' }
  /technologies/{slug}:
    get:
      summary: Get a published technology track
      security: []
      tags: [Catalogue]
      operationId: getTechnology
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: Published technology
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Technology' }
        '404': { $ref: '#/components/responses/NotFound' }
  /technologies/{technologySlug}/categories:
    get:
      summary: List published categories for a technology
      security: []
      tags: [Catalogue]
      operationId: listCategories
      parameters:
        - name: technologySlug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Published categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
  /categories/{categorySlug}/lessons:
    get:
      summary: List published lessons in a category
      security: []
      tags: [Catalogue]
      operationId: listLessons
      parameters:
        - name: categorySlug
