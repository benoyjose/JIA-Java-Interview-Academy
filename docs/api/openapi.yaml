                  scoredAttempts: { type: integer, minimum: 0 }
                  topTopics:
                    type: array
                    maxItems: 5
                    items:
                      type: object
                      required: [topicSlug, topicName, attempts]
                      properties:
                        topicSlug: { type: string }
                        topicName: { type: string }
                        attempts: { type: integer, minimum: 0 }
                        averageScorePercent: { type: [number, 'null'], minimum: 0, maximum: 100 }
