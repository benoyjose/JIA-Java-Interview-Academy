openapi: 3.1.0
info:
  title: JIA API
  version: 1.1.0
  description: Shared API contract for Spring Boot and Laravel backends.
servers:
  - url: /api/v1
tags:
  - name: Authentication
  - name: Catalogue
paths:
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 160 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '201':
          description: Learner account created and token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '409': { description: Email already registered }
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, maxLength: 128 }
                deviceName: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { description: Invalid credentials }
  /auth/federated/google:
    post:
      tags: [Authentication]
      operationId: authenticateWithGoogle
      summary: Exchange a Google ID token for a JIA session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
                nonce: { type: string }
                deviceName: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Authenticated or linked Google identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { description: Invalid or expired provider token }
  /auth/federated/apple:
    post:
      tags: [Authentication]
      operationId: authenticateWithApple
      summary: Exchange an Apple identity token for a JIA session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityToken]
              properties:
                identityToken: { type: string }
                authorizationCode: { type: string }
                nonce: { type: string }
                fullName:
                  type: [object, 'null']
                  properties:
                    givenName: { type: string }
                    familyName: { type: string }
                deviceName: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Authenticated or linked Apple identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { description: Invalid or expired provider token }
  /auth/phone/otp:
    post:
      tags: [Authentication]
      operationId: requestPhoneOtp
      summary: Request a one-time SMS verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber]
              properties:
                phoneNumber:
                  type: string
                  description: E.164 formatted phone number, for example +919876543210
                  pattern: '^\\+[1-9][0-9]{7,14}    get:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { description: Unauthenticated }
  /auth/logout:
    post:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Token revoked }
        '401': { description: Unauthenticated }
  /technologies:
    get:
      tags: [Catalogue]
      operationId: listTechnologies
      responses:
        '200':
          description: Published technologies
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Technology' } }
  /technologies/{slug}:
    get:
      tags: [Catalogue]
      operationId: getTechnology
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: Published technology
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Technology' }
        '404': { $ref: '#/components/responses/NotFound' }
  /technologies/{technologySlug}/categories:
    get:
      tags: [Catalogue]
      operationId: listCategories
      parameters:
        - name: technologySlug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Published categories
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Category' } }
  /categories/{categorySlug}/lessons:
    get:
      tags: [Catalogue]
      operationId: listLessons
      parameters:
        - name: categorySlug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Published lessons
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LessonSummary' } }
  /lessons/{slug}:
    get:
      tags: [Catalogue]
      operationId: getLesson
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: Published lesson
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque token
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
  responses:
    NotFound:
      description: Not found or not published
  schemas:
    User:
      type: object
      required: [id, name, email, roles]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        roles: { type: array, items: { type: string } }
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
    Technology:
      type: object
      required: [id, slug, name, sortOrder]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        sortOrder: { type: integer }
    Category:
      type: object
      required: [id, slug, name, sortOrder, technologySlug]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        sortOrder: { type: integer }
        technologySlug: { type: string }
    LessonSummary:
      type: object
      required: [id, slug, title, difficulty, contentRevision]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: [string, 'null'] }
        difficulty: { type: string }
        contentRevision: { type: integer }
    Lesson:
      allOf:
        - $ref: '#/components/schemas/LessonSummary'
        - type: object
          required: [sourceType]
          properties:
            sourceType: { type: string }
            contentJson: { type: [string, 'null'] }

      responses:
        '202': { description: Request accepted; response must not disclose account existence }
        '429': { description: OTP request rate limit exceeded }
  /auth/phone/verify:
    post:
      tags: [Authentication]
      operationId: verifyPhoneOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber, code]
              properties:
                phoneNumber: { type: string, pattern: '^\\+[1-9][0-9]{7,14}    get:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { description: Unauthenticated }
  /auth/logout:
    post:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Token revoked }
        '401': { description: Unauthenticated }
  /technologies:
    get:
      tags: [Catalogue]
      operationId: listTechnologies
      responses:
        '200':
          description: Published technologies
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Technology' } }
  /technologies/{slug}:
    get:
      tags: [Catalogue]
      operationId: getTechnology
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: Published technology
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Technology' }
        '404': { $ref: '#/components/responses/NotFound' }
  /technologies/{technologySlug}/categories:
    get:
      tags: [Catalogue]
      operationId: listCategories
      parameters:
        - name: technologySlug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Published categories
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Category' } }
  /categories/{categorySlug}/lessons:
    get:
      tags: [Catalogue]
      operationId: listLessons
      parameters:
        - name: categorySlug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Published lessons
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LessonSummary' } }
  /lessons/{slug}:
    get:
      tags: [Catalogue]
      operationId: getLesson
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: Published lesson
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
        '404': { $ref: '#/components/responses/NotFound' }
