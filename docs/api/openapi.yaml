    post:
      summary: Verify a phone verification code
      security: []
      tags: [Authentication]
      operationId: verifyPhoneOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber, code]
              properties:
                phoneNumber:
                  type: string
                  pattern: '^\+[1-9][0-9]{7,14}$'
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
                deviceName:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Phone verified and session issued
          content:
