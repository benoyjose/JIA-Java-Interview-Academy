        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Remove a lesson bookmark (idempotent)
      tags: [Learning]
      operationId: deleteBookmark
      parameters:
        - name: lessonSlug
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Bookmark removed }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /quizzes/availability:
    get:
      security: []
      summary: Preview published question availability by difficulty and topic
      tags: [Assessments]
      operationId: getQuizAvailability
      parameters:
        - name: technologySlug
          in: query
          schema: { type: string }
        - name: categorySlug
          in: query
          schema: { type: string }
        - name: difficulty
          in: query
          required: true
          schema: { $ref: '#/components/schemas/QuizDifficulty' }
      responses:
        '200':
          description: Available published question count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizAvailability' }
  /quiz-attempts:
    post:
      summary: Start a difficulty-selected quiz attempt
      tags: [Assessments]
      operationId: startQuizAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [difficulty]
              properties:
                technologySlug: { type: string }
                categorySlug: { type: string }
                difficulty: { $ref: '#/components/schemas/QuizDifficulty' }
                questionCount: { type: integer, minimum: 1, maximum: 100, default: 10 }
                mode:
                  type: string
                  enum: [PRACTICE, TIMED_MOCK, DAILY_CHALLENGE, WEAK_AREA, TOPIC_ASSESSMENT, MIXED_CHALLENGE, RETRY_INCORRECT]
                  description: WEAK_AREA prioritizes categories with the learner's lowest historical answer accuracy; categories without history are ranked after measured categories.
                  default: PRACTICE
                durationSeconds:
                  type: integer
                  minimum: 60
                  maximum: 21600
                  description: Required for TIMED_MOCK; server sets deadlineAt from this duration. Ignored for DAILY_CHALLENGE and WEAK_AREA.
      responses:
        '201':
          description: Quiz attempt created; answer keys are withheld
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizAttemptStart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /quiz-attempts/{attemptId}:
    get:
      summary: Resume an owned in-progress attempt with its question snapshot and saved responses
      tags: [Assessments]
      operationId: resumeQuizAttempt
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: In-progress attempt and saved answer state
          content:
            application/json:
              schema:
                type: object
                required: [attemptId, difficulty, mode, status, questionCount, questions, savedAnswers]
                properties:
                  attemptId: { type: string, format: uuid }
                  difficulty: { $ref: '#/components/schemas/QuizDifficulty' }
                  mode: { type: string, enum: [PRACTICE, TIMED_MOCK, DAILY_CHALLENGE, WEAK_AREA] }
                  status: { type: string, const: IN_PROGRESS }
                  questionCount: { type: integer }
                  durationLimitSeconds: { type: [integer, 'null'] }
                  deadlineAt: { type: [string, 'null'], format: date-time }
                  challengeDate: { type: [string, 'null'], format: date }
                  startedAt: { type: string, format: date-time }
                  questions: { type: array, items: { $ref: '#/components/schemas/QuizQuestion' } }
                  savedAnswers:
                    type: array
                    items:
                      type: object
                      required: [position, response]
                      properties:
                        position: { type: integer }
                        response: { type: object, additionalProperties: true }
                        timeSpentMs: { type: [integer, 'null'], minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /quiz-attempts/{attemptId}/abandon:
    post:
      summary: Abandon an owned in-progress attempt
      tags: [Assessments]
      operationId: abandonQuizAttempt
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Attempt marked abandoned
          content:
            application/json:
              schema:
                type: object
                required: [attemptId, status]
                properties:
                  attemptId: { type: string, format: uuid }
                  status: { type: string, const: ABANDONED }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /quiz-attempts/{attemptId}/answers:
    post:
      summary: Save partial answers for an active attempt
      tags: [Assessments]
      operationId: saveQuizAttemptAnswers
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [position, response]
                    properties:
                      position: { type: integer, minimum: 1 }
                      response: { type: object, additionalProperties: true }
                      timeSpentMs: { type: integer, minimum: 0 }
      responses:
        '200': { description: Partial answers saved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /quiz-attempts/{attemptId}/submit:
    post:
      summary: Submit and grade a quiz attempt
      tags: [Assessments]
      operationId: submitQuizAttempt
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    required: [position, response]
                    properties:
                      position: { type: integer, minimum: 1 }
                      response: { type: object, additionalProperties: true }
                      timeSpentMs: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Attempt graded and saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizAttemptResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/quiz-performance:
    get:
      summary: Get learner quiz performance by difficulty and topic
      tags: [Assessments]
      operationId: getMyQuizPerformance
      responses:
        '200':
          description: Difficulty and topic performance summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizPerformance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/quiz-attempts:
    get:
      summary: List the authenticated learner's quiz history
      tags: [Assessments]
      operationId: listMyQuizAttempts
      parameters:
        - name: difficulty
          in: query
          schema: { $ref: '#/components/schemas/QuizDifficulty' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Recent quiz attempts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QuizAttemptSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/questions/import:
    post:
      summary: Import a batch of reviewed objective question drafts
      description: Create-only import. Questions remain DRAFT and answer keys are never returned by learner-facing endpoints.
      tags: [Content Admin]
      operationId: importQuestionDrafts
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/question-import-v1.schema.json' }
      responses:
        '201': { description: Questions imported as immutable draft revisions }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/lessons/import:
    post:
      summary: Import a batch of lesson drafts
      description: Validates schema and provenance; imports create drafts and never auto-publish content.
      tags: [Content Admin]
      operationId: importLessonDrafts
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/lesson-import-v1.schema.json' }
      responses:
        '201':
          description: Lessons imported as draft revisions
          content:
            application/json:
              schema:
                type: object
                required: [formatVersion, importedCount, lessons]
                properties:
                  formatVersion: { type: integer }
                  importedCount: { type: integer, minimum: 0 }
                  lessons:
                    type: array
                    items:
                      type: object
                      required: [slug, status, revisionNumber]
                      properties:
                        slug: { type: string }
                        status: { type: string, const: DRAFT }
                        revisionNumber: { type: integer, minimum: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/lessons:
    get:
      summary: List lessons for content administration
      tags: [Content Admin]
      operationId: listAdminLessons
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [DRAFT, IN_REVIEW, APPROVED, PUBLISHED, ARCHIVED]
        - name: q
          in: query
          description: Case-insensitive prefix search across title, slug and category slug
          schema: { type: string, maxLength: 120 }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Searchable lesson page, newest updates first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLessonPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a lesson draft
      tags: [Content Admin]
      operationId: createLessonDraft
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LessonDraftRequest' }
      responses:
        '200':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/lessons/{lessonId}:
    get:
      summary: Get the current editable revision for a lesson
      tags: [Content Admin]
      operationId: getAdminLesson
      security: [{ bearerAuth: [] }]
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current draft or published revision detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonAuthoringDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Update a draft lesson and create a revision
      tags: [Content Admin]
      operationId: updateLessonDraft
      security: [{ bearerAuth: [] }]
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LessonDraftRequest' }
      responses:
        '200':
          description: Draft updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/lessons/{lessonId}/submit:
    post:
      summary: Submit a draft for review
      tags: [Content Admin]
      operationId: submitLessonForReview
      security: [{ bearerAuth: [] }]
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Review task created }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/reviews:
    get:
      summary: List pending content reviews
      tags: [Content Admin]
      operationId: listPendingContentReviews
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          description: Case-insensitive prefix search across lesson title, slug and submitter name
          schema: { type: string, maxLength: 120 }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Searchable pending review page, oldest submissions first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewQueuePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/reviews/{taskId}:
    get:
      summary: Get the exact pending revision submitted for review
      tags: [Content Admin]
      operationId: getContentReviewDetail
      security: [{ bearerAuth: [] }]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Immutable revision snapshot for reviewer inspection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/reviews/{taskId}/decision:
    post:
      summary: Approve, request changes or reject a lesson revision
      tags: [Content Admin]
      operationId: decideContentReview
      security: [{ bearerAuth: [] }]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVE, REQUEST_CHANGES, REJECT] }
                comment: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '200': { description: Review decision recorded }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/lessons/{lessonId}/rollback:
    post:
      summary: Create a new draft by copying a selected historical lesson revision
      description: A published revision remains live; the rollback copy must pass the normal review and publication workflow.
      tags: [Content Admin]
      operationId: rollbackLessonRevision
      security: [{ bearerAuth: [] }]
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revisionNumber]
              properties:
                revisionNumber: { type: integer, minimum: 1 }
                changeNote: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: A new draft revision created from the selected historical revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/lessons/{lessonId}/archive:
    post:
      summary: Archive a lesson without deleting its revisions or audit history
      tags: [Content Admin]
      operationId: archiveLesson
      security: [{ bearerAuth: [] }]
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Lesson archived; published revision history is retained
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/lessons/{lessonId}/preview:
    get:
      summary: Preview the current draft or pending lesson revision using learner content fields
      description: Requires content.create or content.review. This endpoint never changes public catalogue visibility.
      tags: [Content Admin]
      operationId: previewLesson
      security: [{ bearerAuth: [] }]
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Authorized preview of the selected lesson revision
          content:
            application/json:
              schema:
                type: object
                required: [id, slug, title, difficulty, revisionNumber, sourceType, contentJson, preview, lifecycleStatus]
                properties:
                  id: { type: string, format: uuid }
                  slug: { type: string }
                  title: { type: string }
                  summary: { type: [string, 'null'] }
                  difficulty: { type: string }
                  revisionNumber: { type: integer }
                  sourceType: { type: string }
                  contentJson: { type: string }
                  preview: { type: boolean, const: true }
                  lifecycleStatus: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/lessons/{lessonId}/unpublish:
    post:
      summary: Remove a published lesson from the public catalogue while retaining its published revision
      tags: [Content Admin]
      operationId: unpublishLesson
      security: [{ bearerAuth: [] }]
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Lesson unpublished; revision history is retained }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/lessons/{lessonId}/publish:
    post:
      summary: Publish an approved lesson
      tags: [Content Admin]
      operationId: publishLesson
      security: [{ bearerAuth: [] }]
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Lesson published }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/media/uploads:
    post:
      summary: Create a short-lived direct-to-object-storage upload
      description: Requires content.create. Creates academy-scoped PENDING metadata and returns a presigned S3-compatible PUT URL. Allowed types are JPEG, PNG, WebP, PDF and MP4.
      tags: [Content Admin]
      operationId: createMediaUpload
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, contentType, sizeBytes]
              properties:
                lessonId: { type: [string, 'null'], format: uuid }
                fileName: { type: string, maxLength: 255 }
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf, video/mp4] }
                sizeBytes: { type: integer, minimum: 1, maximum: 262144000 }
      responses:
        '201':
          description: Upload URL and required request headers
          content:
            application/json:
              schema:
                type: object
                required: [id, status, method, uploadUrl, expiresAt, requiredHeaders]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, const: PENDING }
                  method: { type: string, const: PUT }
                  uploadUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
                  requiredHeaders: { type: object, additionalProperties: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: File exceeds the media-type size limit }
        '503': { description: S3-compatible object storage is not configured }
  /admin/media/{mediaId}/complete:
    post:
      summary: Verify an uploaded object and mark its metadata READY
      tags: [Content Admin]
      operationId: completeMediaUpload
      security: [{ bearerAuth: [] }]
      parameters:
        - name: mediaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Upload verified and metadata marked READY }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Object is missing or its size/content type does not match the declaration }
        '503': { description: S3-compatible object storage is not configured }
  /admin/media/{mediaId}:
    get:
      summary: Read academy-scoped media metadata
      tags: [Content Admin]
      operationId: getMediaAsset
      security: [{ bearerAuth: [] }]
      parameters:
        - name: mediaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Media metadata; PENDING assets are not learner-ready }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/progress-events:
    post:
      summary: Append one learner activity event
      tags: [Learning]
      operationId: appendLearnerProgressEvent
      description: Authenticated identity and academy membership are server-derived. schemaVersion is currently fixed to 1. A repeated event ID with an identical body returns DUPLICATE; reusing it with a different body returns 409. Client mastery and authoritative scores are never accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, eventType, occurredAt]
              properties:
                eventId: { type: string, format: uuid, description: Client-generated stable idempotency key }
                eventType: { type: string, enum: [LESSON_STARTED, LESSON_COMPLETED, QUESTION_ANSWERED, QUIZ_SUBMITTED, BOOKMARK_CHANGED, REVIEW_COMPLETED] }
                occurredAt: { type: string, format: date-time }
                lessonSlug: { type: [string, 'null'], maxLength: 160 }
                payload: { type: object, maxProperties: 30, description: 'Optional bounded metadata object; server rejects sensitive or authoritative fields and payloads over 8 KiB.' }
      responses:
        '200':
          description: Event accepted or identical duplicate
          content:
            application/json:
              schema:
                type: object
                required: [eventId, status, occurredAt]
                properties:
                  eventId: { type: string, format: uuid }
                  status: { type: string, enum: [ACCEPTED, DUPLICATE] }
                  occurredAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound', description: Published lesson slug was not found in the authenticated academy }
        '409': { description: Event ID was already used with a different event body }
        '413': { description: Event payload exceeds configured limit }
        '429': { description: Rate limit exceeded; retry with backoff }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/progress-events/batch:
    post:
      summary: Atomically ingest a bounded batch of learner activity events
      tags: [Learning]
      operationId: appendLearnerProgressEventBatch
      description: >-
        Accepts 1–100 events in one transaction. Authenticated learner and academy
        are server-derived. Identical retries return DUPLICATE receipts. A malformed
        event or conflicting reuse of an event ID rolls back the whole batch.
        Client mastery, correctness, answer keys and credentials are prohibited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/LearnerProgressEvent' }
      responses:
        '200':
          description: Batch committed; events are accepted or identical duplicates
          content:
            application/json:
              schema:
                type: object
                required: [events, acceptedCount, duplicateCount]
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/LearnerProgressEventReceipt' }
                  acceptedCount: { type: integer, minimum: 0 }
                  duplicateCount: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Conflicting event ID; entire batch rolled back }

  /me/progress-events/history:
    get:
      summary: Read learner progress history and derived event counts
      tags: [Learning]
      operationId: getLearnerProgressHistory
      parameters:
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 256 } }
        - { name: eventType, in: query, schema: { type: string, enum: [LESSON_STARTED, LESSON_COMPLETED, QUESTION_ANSWERED, QUIZ_SUBMITTED, BOOKMARK_CHANGED, REVIEW_COMPLETED] } }
      responses:
        '200':
          description: Learner-scoped page with server-derived event totals
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, pageSize, summary]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [eventId, eventType, occurredAt]
                      properties:
                        eventId: { type: string, format: uuid }
                        eventType: { type: string }
                        occurredAt: { type: string, format: date-time }
                        lessonSlug: { type: [string, 'null'] }
                  nextCursor: { type: [string, 'null'] }
                  pageSize: { type: integer }
                  summary:
                    type: array
                    items:
                      type: object
                      required: [eventType, count]
                      properties:
                        eventType: { type: string }
                        count: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }


  /me/progress-sync/batch:
    post:
      summary: Reconcile a bounded batch of offline learner activity
      tags: [Learning]
      operationId: reconcileLearnerOfflineActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events: { type: array, minItems: 1, maxItems: 100, items: { type: object } }
      responses:
        '200': { description: Idempotent per-event reconciliation receipts }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Event identity or revision conflict }
        '422': { description: Invalid event or unavailable lesson }
  /me/reviews:
    get:
      summary: Read the authenticated learner's adaptive review queue
      tags: [Learning]
      operationId: getLearnerAdaptiveReviewQueue
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200': { description: Server-calculated learner review queue and scheduling evidence }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /me/reviews/due:
    get:
      summary: Read due Laravel spaced-review lessons for the authenticated learner
      tags: [Learning]
      operationId: getLearnerDueSpacedReviews
      responses:
        '200': { description: Due review queue }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/reviews/{lessonSlug}/grade:
    post:
      summary: Grade a Laravel spaced review and persist its next interval
      tags: [Learning]
      operationId: gradeLearnerSpacedReview
      parameters:
        - { name: lessonSlug, in: path, required: true, schema: { type: string, maxLength: 180 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [rating], properties: { rating: { type: integer, minimum: 0, maximum: 5 } } }
      responses:
        '200': { description: Review rating and next due interval }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/review-schedule/due:
    get:
      summary: Read due Spring spaced-review lessons
      tags: [Learning]
      operationId: getLearnerReviewScheduleDue
      responses:
        '200': { description: Due review schedule entries }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/review-schedule/{lessonSlug}/grade:
    post:
      summary: Persist a spaced-review rating and calculate next due date
      tags: [Learning]
      operationId: gradeLearnerReviewSchedule
      parameters:
        - { name: lessonSlug, in: path, required: true, schema: { type: string, maxLength: 180 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [rating], properties: { rating: { type: integer, minimum: 0, maximum: 5 } } }
      responses:
        '200': { description: Persisted next review schedule }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/review-schedule/preview:
    post:
      summary: Preview deterministic spaced-review schedule
      tags: [Learning]
      operationId: previewLearnerSpacedReviewSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, repetitions, easeFactor, intervalDays]
              properties:
                rating: { type: integer, minimum: 0, maximum: 5 }
                repetitions: { type: integer, minimum: 0 }
                easeFactor: { type: number, minimum: 1.3, maximum: 3.0 }
                intervalDays: { type: integer, minimum: 0, maximum: 365 }
                reviewedOn: { type: [string, 'null'], format: date }
      responses:
        '200': { description: Deterministic interval and due date }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  schemas:
    LearnerReminderPreferences:
      type: object
      required: [enabled, timezone, reminderTime, quietStart, quietEnd, dailyGoalMinutes, weeklyGoalDays]
      properties:
        enabled: { type: boolean }
        timezone: { type: string, maxLength: 64, description: "IANA timezone identifier" }
        reminderTime: { type: string, pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9])?$" }
        quietStart: { type: string, description: "Empty string disables quiet hours", pattern: "^$|^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9])?$" }
        quietEnd: { type: string, description: "Empty string disables quiet hours", pattern: "^$|^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9])?$" }
        dailyGoalMinutes: { type: integer, minimum: 0, maximum: 240 }
        weeklyGoalDays: { type: integer, minimum: 1, maximum: 7 }
    LearnerProgressEvent:
      type: object
      required: [eventId, eventType, occurredAt]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string, enum: [LESSON_STARTED, LESSON_COMPLETED, QUESTION_ANSWERED, QUIZ_SUBMITTED, BOOKMARK_CHANGED, REVIEW_COMPLETED] }
        occurredAt: { type: string, format: date-time }
        lessonSlug: { type: [string, 'null'], maxLength: 160 }
        payload: { type: object, maxProperties: 30, description: Optional non-sensitive metadata; server validates content and 8 KiB limit }
    LearnerProgressEventReceipt:
      type: object
      required: [eventId, status, occurredAt]
      properties:
        eventId: { type: string, format: uuid }
        status: { type: string, enum: [ACCEPTED, DUPLICATE] }
        occurredAt: { type: string, format: date-time }
    LearnerNotificationPreferences:
      type: object
      required: [remindersEnabled, pushEnabled, timezone]
      properties:
        remindersEnabled: { type: boolean }
        pushEnabled: { type: boolean }
        quietStart: { type: [string, 'null'], pattern: '^([01]\\d|2[0-3]):[0-5]\\d(:[0-5]\\d)?$' }
        quietEnd: { type: [string, 'null'], pattern: '^([01]\\d|2[0-3]):[0-5]\\d(:[0-5]\\d)?$' }
        timezone: { type: string, maxLength: 80, example: 'Asia/Kolkata' }
    RevisionDue:
      type: object
      required: [lessonSlug, title, stage, dueAt]
      properties:
        lessonSlug: { type: string }
        title: { type: string }
        stage: { type: integer, minimum: 0, maximum: 5 }
        dueAt: { type: string, format: date-time }
    LearnerNotification:
      type: object
      required: [id, title, message, payload, status, scheduledAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        message: { type: string }
        payload: { type: string, description: JSON payload serialized by this endpoint }
        status: { type: string, enum: [PENDING, SENT, READ, SKIPPED] }
        scheduledAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [BAD_REQUEST, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, VALIDATION_ERROR, RATE_LIMITED, INTERNAL_ERROR, HTTP_ERROR]
        message: { type: string }
        traceId: { type: string, description: Optional request correlation identifier }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    User:
      type: object
      required: [id, name, roles]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: [string, 'null'], format: email }
        roles:
          type: array
          items: { type: string }
    TokenResponse:
      type: object
      description: Access tokens expire after 15 minutes. Refresh tokens are single-use, rotate on refresh, and expire after 30 days.
      required: [accessToken, refreshToken, tokenType, expiresAt, user]
      properties:
        accessToken: { type: string, description: Short-lived bearer token; expires after 15 minutes }
        refreshToken: { type: string, description: Single-use rotating refresh token; valid for up to 30 days }
        tokenType: { type: string, const: Bearer }
        expiresAt: { type: string, format: date-time, description: Access-token expiration timestamp }
        user: { $ref: '#/components/schemas/User' }
    Technology:
      type: object
      required: [id, slug, name, sortOrder]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        sortOrder: { type: integer }
    Category:
      type: object
      required: [id, slug, name, sortOrder, technologySlug]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        sortOrder: { type: integer }
        technologySlug: { type: string }
    LessonSummary:
      type: object
      required: [id, slug, title, difficulty, contentRevision]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: [string, 'null'] }
        difficulty: { type: string }
        contentRevision: { type: integer }

    QuizDifficulty:
      type: string
      enum: [BEGINNER, NOVICE, PROFESSIONAL, EXPERT]
    QuizAvailability:
      type: object
      required: [difficulty, availableQuestionCount]
      properties:
        difficulty: { $ref: '#/components/schemas/QuizDifficulty' }
        availableQuestionCount: { type: integer, minimum: 0 }
    QuizQuestion:
      type: object
      required: [position, questionId, revisionId, questionType, prompt, difficulty]
      properties:
        position: { type: integer }
        questionId: { type: string, format: uuid }
        revisionId: { type: string, format: uuid }
        questionType: { type: string }
        prompt: { type: object, additionalProperties: true }
        options: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        hint: { type: [string, 'null'] }
        difficulty: { $ref: '#/components/schemas/QuizDifficulty' }
    QuizAttemptStart:
      type: object
      required: [attemptId, difficulty, mode, questionCount, questions, durationLimitSeconds, deadlineAt, challengeDate]
      properties:
        attemptId: { type: string, format: uuid }
        difficulty: { $ref: '#/components/schemas/QuizDifficulty' }
        mode: { type: string }
        questionCount: { type: integer }
        durationLimitSeconds: { type: [integer, 'null'], minimum: 60, maximum: 21600 }
        deadlineAt: { type: [string, 'null'], format: date-time }
        challengeDate: { type: [string, 'null'], format: date, description: UTC calendar date for DAILY_CHALLENGE; the same attempt and question snapshot is returned on repeat starts that day. }
        questions:
          type: array
          items: { $ref: '#/components/schemas/QuizQuestion' }
    QuizAttemptResult:
      type: object
      required: [attemptId, difficulty, questionCount, correctCount, gradedQuestionCount, selfReviewQuestionCount, scorePercent, submittedAt, timedOut]
      properties:
        attemptId: { type: string, format: uuid }
        difficulty: { $ref: '#/components/schemas/QuizDifficulty' }
        questionCount: { type: integer }
        correctCount: { type: integer }
        gradedQuestionCount: { type: integer, minimum: 0 }
        selfReviewQuestionCount: { type: integer, minimum: 0 }
        scorePercent: { type: number, minimum: 0, maximum: 100 }
        submittedAt: { type: string, format: date-time }
        timedOut: { type: boolean }
        answers:
          type: array
          items:
            type: object
            required: [position, isCorrect, requiresSelfReview, explanation]
            properties:
              position: { type: integer }
              isCorrect: { type: [boolean, 'null'], description: Null when rubric-based self-review is required. }
              requiresSelfReview: { type: boolean }
              explanation: { type: string }
    QuizAttemptSummary:
      type: object
      required: [attemptId, difficulty, mode, questionCount, correctCount, scorePercent, startedAt, status]
      properties:
        attemptId: { type: string, format: uuid }
        difficulty: { $ref: '#/components/schemas/QuizDifficulty' }
        mode: { type: string, enum: [PRACTICE, TIMED_MOCK, DAILY_CHALLENGE, WEAK_AREA] }
        technologySlug: { type: [string, 'null'] }
        categorySlug: { type: [string, 'null'] }
        questionCount: { type: integer }
        correctCount: { type: [integer, 'null'] }
        scorePercent: { type: [number, 'null'] }
        startedAt: { type: string, format: date-time }
        status: { type: string }
    QuizPerformance:
      type: object
      required: [byDifficulty, byTopic]
      properties:
        byDifficulty:
          type: array
          items:
            type: object
            required: [difficulty, attempts, questionsAttempted, correctAnswers, accuracyPercent]
            properties:
              difficulty: { $ref: '#/components/schemas/QuizDifficulty' }
              attempts: { type: integer }
              questionsAttempted: { type: integer }
              correctAnswers: { type: integer }
              accuracyPercent: { type: [number, 'null'] }
              bestScorePercent: { type: [number, 'null'] }
              latestAttemptAt: { type: [string, 'null'], format: date-time }
        byTopic:
          type: array
          items:
            type: object
            required: [technologySlug, difficulty, attempts, accuracyPercent]
            properties:
              technologySlug: { type: [string, 'null'] }
              categorySlug: { type: [string, 'null'] }
              difficulty: { $ref: '#/components/schemas/QuizDifficulty' }
              attempts: { type: integer }
              accuracyPercent: { type: [number, 'null'] }
    AdminLessonPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminLessonListItem' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0, format: int64 }
        totalPages: { type: integer, minimum: 0 }
    ReviewQueuePage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContentReviewTask' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0, format: int64 }
        totalPages: { type: integer, minimum: 0 }
    AdminLessonListItem:
      type: object
      required: [id, slug, title, categorySlug, status, contentRevision, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        categorySlug: { type: string }
        status: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, PUBLISHED, ARCHIVED] }
        contentRevision: { type: integer }
        publishedRevision: { type: [integer, 'null'] }
        draftRevision: { type: [integer, 'null'] }
        updatedAt: { type: string, format: date-time }
    LessonAuthoringDetail:
      type: object
      required: [id, slug, title, categorySlug, difficulty, sourceType, contentJson, status, revisionNumber, editingDraft, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: [string, 'null'] }
        categorySlug: { type: string }
        difficulty: { type: string }
        sourceType: { type: string }
        contentJson: { type: string }
        status: { type: string }
        revisionNumber: { type: integer }
        publishedRevision: { type: [integer, 'null'] }
        editingDraft: { type: boolean }
        changeNote: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
    ReviewDetail:
      type: object
      required: [taskId, lessonId, revisionId, slug, title, difficulty, sourceType, contentJson, revisionNumber, submittedBy, submittedAt, lessonStatus]
      properties:
        taskId: { type: string, format: uuid }
        lessonId: { type: string, format: uuid }
        revisionId: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: [string, 'null'] }
        difficulty: { type: string }
        sourceType: { type: string }
        contentJson: { type: string }
        revisionNumber: { type: integer }
        changeNote: { type: [string, 'null'] }
        submittedBy: { type: string }
        submittedAt: { type: string, format: date-time }
        lessonStatus: { type: string }
    LessonDraftRequest:
      type: object
      required: [categorySlug, slug, title, difficulty, sourceType, contentJson]
      properties:
        categorySlug: { type: string, maxLength: 100 }
        slug: { type: string, maxLength: 120 }
        title: { type: string, maxLength: 200 }
        summary: { type: [string, 'null'], maxLength: 700 }
        difficulty: { type: string, enum: [BEGINNER, NOVICE, PROFESSIONAL, EXPERT] }
        sourceType: { type: string, enum: [USER_ORIGINAL, ADMIN_AUTHORED, EXTERNAL_REFERENCE] }
        contentJson: { type: string, description: JSON lesson document with schemaVersion and blocks }
        changeNote: { type: [string, 'null'], maxLength: 500 }
    LessonDraft:
      type: object
      required: [id, slug, title, status, revisionNumber]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        status: { type: string, const: DRAFT }
        revisionNumber: { type: integer, minimum: 1 }
    ContentReviewTask:
      type: object
      required: [taskId, lessonId, revisionId, slug, title, submittedBy, status, submittedAt]
      properties:
        taskId: { type: string, format: uuid }
        lessonId: { type: string, format: uuid }
        revisionId: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        submittedBy: { type: string }
        status: { type: string, const: PENDING }
        submittedAt: { type: string, format: date-time }
    ContentRelease:
      type: object
      required: [version, createdAt, items]
      properties:
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [id, slug, title, contentRevision, checksum]
            properties:
              id: { type: string, format: uuid }
              slug: { type: string }
              title: { type: string }
              contentRevision: { type: integer, minimum: 1 }
              checksum: { type: string, pattern: '^[a-f0-9]{64}$' }
    Lesson:
      allOf:
        - $ref: '#/components/schemas/LessonSummary'
        - type: object
          required: [sourceType]
          properties:
            sourceType: { type: string }
            contentJson: { type: [string, 'null'] }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque token
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Not found or not published
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimited:
      description: Request rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }