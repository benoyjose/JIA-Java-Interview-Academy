openapi: 3.1.0
info:
  title: JIA API
  version: 1.0.0
  description: Normative shared contract for Spring Boot and Laravel implementations and Android, iOS and admin clients.
servers:
  - url: /api/v1
tags:
  - name: Catalogue
paths:
  /technologies:
    get:
      tags: [Catalogue]
      operationId: listTechnologies
      responses:
        '200':
          description: Published technologies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Technology' }
  /technologies/{slug}:
    get:
      tags: [Catalogue]
      operationId: getTechnology
      parameters: [ { $ref: '#/components/parameters/Slug' } ]
      responses:
        '200':
          description: Published technology
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Technology' }
        '404': { $ref: '#/components/responses/NotFound' }
  /technologies/{technologySlug}/categories:
    get:
      tags: [Catalogue]
      operationId: listCategories
      parameters:
        - name: technologySlug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Published categories for a technology
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
  /categories/{categorySlug}/lessons:
    get:
      tags: [Catalogue]
      operationId: listLessons
      parameters:
        - name: categorySlug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Published lesson summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LessonSummary' }
  /lessons/{slug}:
    get:
      tags: [Catalogue]
      operationId: getLesson
      parameters: [ { $ref: '#/components/parameters/Slug' } ]
      responses:
        '200':
          description: Published lesson detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
  responses:
    NotFound:
      description: Resource not found or not published
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Technology:
      type: object
      required: [id, slug, name, sortOrder]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        sortOrder: { type: integer }
    Category:
      type: object
      required: [id, slug, name, sortOrder, technologySlug]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        sortOrder: { type: integer }
        technologySlug: { type: string }
    LessonSummary:
      type: object
      required: [id, slug, title, difficulty, contentRevision]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: [string, 'null'] }
        difficulty: { type: string }
        contentRevision: { type: integer }
    Lesson:
      allOf:
        - $ref: '#/components/schemas/LessonSummary'
        - type: object
          required: [sourceType]
          properties:
            sourceType: { type: string }
            contentJson: { type: [string, 'null'], description: JSON content currently serialized as a string by the Spring Boot implementation; this will be normalized to a structured object in a separately versioned contract change. }
    Error:
      type: object
      properties:
        status: { type: integer }
        error: { type: string }
        message: { type: string }
